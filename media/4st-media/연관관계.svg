<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="500" viewBox="0 0 1140 500">
<style>
  .lbl { font-family:"Apple SD Gothic Neo","Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:700; }
  .hd  { font-size:28px; fill:#111; text-anchor:middle; }
  .cel { font-size:28px; fill:#111; text-anchor:middle; }
  .fld { font-size:25px; fill:#555; text-anchor:middle; }
  .tag { font-size:26px; fill:#d97706; text-anchor:middle; }
  .bx  { fill:none; stroke:#111; stroke-width:3.5; }
  .kc  { fill:none; stroke:#d97706; stroke-width:4; stroke-dasharray:10 8; }
  .cn  { fill:none; stroke:#d97706; stroke-width:4.5; }
  .cd  { fill:none; stroke:#d97706; stroke-width:4; stroke-dasharray:12 9; }
</style>
<defs>
  <marker id="o" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6.5" markerHeight="6.5" orient="auto">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#d97706"/>
  </marker>
</defs>
<rect width="1140" height="500" fill="#ffffff"/>
<g class="lbl">

  <text class="tag" x="250" y="52">김석환의 posts</text>
  <rect class="kc" x="40" y="70" width="420" height="310" rx="20"/>

  <rect x="70" y="150" width="360" height="50" fill="#eaf1fb"/>
  <rect class="bx" x="70" y="100" width="360" height="100" rx="16"/>
  <line class="bx" x1="70" y1="150" x2="430" y2="150"/>
  <text class="hd"  x="250" y="135">Post</text>
  <text class="cel" x="250" y="185">자바 정리</text>

  <rect x="70" y="300" width="360" height="50" fill="#eaf1fb"/>
  <rect class="bx" x="70" y="250" width="360" height="100" rx="16"/>
  <line class="bx" x1="70" y1="300" x2="430" y2="300"/>
  <text class="hd"  x="250" y="285">Post</text>
  <text class="cel" x="250" y="335">SQL 정리</text>

  <rect class="bx" x="700" y="140" width="380" height="180" rx="16"/>
  <line class="bx" x1="700" y1="200" x2="1080" y2="200"/>
  <text class="hd"  x="890" y="182">Member</text>
  <text class="cel" x="890" y="252">김석환</text>
  <text class="fld" x="890" y="295">List&lt;Post&gt; posts</text>

  <path class="cn" marker-end="url(#o)" d="M 460 150 L 692 218"/>
  <path class="cn" marker-end="url(#o)" d="M 460 300 L 692 242"/>
  <rect x="483" y="212" width="176" height="40" fill="#ffffff"/>
  <text class="tag" x="571" y="241">@ManyToOne</text>

  <path class="cd" marker-end="url(#o)" d="M 890 330 L 890 425 Q 890 440 875 440 L 315 440 Q 300 440 300 425 L 300 392"/>
  <text class="tag" x="595" y="483">@OneToMany (mappedBy = "member")</text>
</g>
</svg>
